<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行项目 - 结伴出行</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="trips-page">
  <div id="toast" class="toast hidden"></div>

  <nav class="top-nav">
    <div class="top-nav-left">
      <a href="/" class="nav-link">← 旅行地图</a>
      <span class="nav-title">旅行项目</span>
    </div>
    <div class="user-info">
      <span id="current-user" class="current-user"></span>
      <button id="logout-btn" class="btn btn-small btn-ghost">退出</button>
    </div>
  </nav>

  <div id="guest-banner" class="guest-banner guest-banner-top hidden">游客模式 · 正在浏览 admin 的旅行项目（只读）</div>

  <main class="trips-main">
    <!-- 出发城市 -->
    <section class="card" id="profile-card">
      <div class="card-title">🏠 我的出发城市</div>
      <div id="home-set" class="home-row hidden">
        <span id="home-name" class="home-name"></span>
        <button id="home-change" class="btn btn-small btn-ghost">修改</button>
      </div>
      <div id="home-search-box" class="home-row">
        <div class="search-box search-box-inline">
          <input type="text" id="home-search-input" placeholder="搜索并选择你的常住城市" autocomplete="off">
          <ul id="home-search-results" class="search-results hidden"></ul>
        </div>
      </div>
    </section>

    <!-- 发起旅行 -->
    <section class="card" id="create-card">
      <div class="card-title-row">
        <div class="card-title">✈️ 发起旅行</div>
        <button id="create-toggle" class="btn btn-primary btn-small">+ 发起旅行</button>
      </div>
    </section>

    <!-- 发起旅行弹窗 -->
    <div id="create-modal" class="modal hidden">
      <div class="modal-mask" id="create-mask"></div>
      <div class="modal-dialog">
        <div class="modal-head">
          <span class="modal-title">✈️ 发起旅行</span>
          <button id="create-close" class="modal-close" title="关闭">×</button>
        </div>
        <div id="create-form" class="create-form">
        <div class="form-grid">
          <label>旅行项目名
            <input type="text" id="f-title" maxlength="50" placeholder="如：五一川西自驾">
          </label>
          <label>出发时间
            <input type="date" id="f-date">
          </label>
          <label>旅行天数
            <input type="number" id="f-days" min="1" max="365" value="3">
          </label>
          <label>出行方式
            <select id="f-transport">
              <option>驾车</option><option>火车</option><option>飞机</option>
              <option>骑行</option><option>步行</option><option>其他</option>
            </select>
          </label>
          <label>总预算（元，可选）
            <input type="number" id="f-budget" min="0" step="0.01" placeholder="如 5000">
          </label>
        </div>

        <div class="form-block">
          <div class="form-label">同行人（回车添加，第一个一般是自己）</div>
          <div id="member-quick" class="member-quick hidden"></div>
          <div class="tag-input" id="member-tags">
            <input type="text" id="member-input" placeholder="输入名字后回车" maxlength="20">
          </div>
        </div>

        <div class="form-block">
          <div class="form-label">目的地（输入搜索，或直接在地图上点击选点）</div>
          <div class="dest-picker">
            <div class="dest-side">
              <div class="search-box">
                <input type="text" id="f-dest-name" placeholder="搜索城市，或直接输入名称" autocomplete="off" maxlength="50">
                <ul id="dest-search-results" class="search-results hidden"></ul>
              </div>
              <div id="dest-coord" class="dest-coord">尚未选点</div>
              <div id="distance-hint" class="distance-hint"></div>
            </div>
            <div id="picker-map" class="picker-map"></div>
          </div>
        </div>

        <div class="form-actions">
          <button id="create-cancel" class="btn btn-ghost">取消</button>
          <button id="create-submit" class="btn btn-primary">发起旅行</button>
        </div>
        </div>
      </div>
    </div>

    <!-- 同行人榜单 -->
    <section class="card hidden" id="companion-card">
      <div class="card-title">👥 同行人榜单</div>
      <div id="companion-list" class="companion-list"></div>
    </section>

    <!-- 项目列表 -->
    <div class="list-head">
      <span class="list-title">全部项目</span>
      <select id="year-filter" class="year-select"><option value="all">全部年份</option></select>
    </div>
    <div id="trips-empty" class="empty-state hidden">还没有旅行项目，点击「发起旅行」开始规划吧</div>
    <div id="trips-list" class="trips-list"></div>
  </main>

  <script src="trips.js"></script>
</body>
</html>
